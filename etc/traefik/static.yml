log:
  level: INFO

api:
  insecure: true

providers:
  docker:
    exposedByDefault: false
    network: traefik-ingress
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
